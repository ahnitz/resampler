[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-sampler"
version = "0.1.0"
description = "Reduce GWOSC 16 kHz strain to a lower sample rate with a properly specified anti-alias filter"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20", "scipy>=1.7", "h5py>=3.0"]

[project.scripts]
data-sampler = "data_sampler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
